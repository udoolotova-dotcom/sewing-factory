<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты — Швейная фабрика</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h2>Швейная фабрика «Ника»</h2>
        <nav class="hor-menu">
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="contacts.html">Контакты</a>
        </nav>
    </header>

    <div class="main-container" style="justify-content: center;">
        <main class="content" style="max-width: 800px;">
            
            <section class="block">
                <h1>Наши контакты</h1>
                <p><b>Адрес:</b> г. Бишкек, ул. Промышленная 12</p>
                <p><b>Телефон:</b> +996 (555) 00-00-00</p>
                <p><b>Email:</b> factory-nika@mail.kg</p>
            </section>

            <!-- Форма обратной связи -->
            <section class="block">
                <h2>Оставить заявку на пошив</h2>
                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="username">Ваше имя:</label>
                        <input type="text" id="username" placeholder="Введите ваше имя" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Номер телефона:</label>
                        <input type="tel" id="phone" placeholder="+996 (_) --" required>
                    </div>

                    <div class="form-group">
                        <label for="service">Интересующая услуга:</label>
                        <select id="service">
                            <option value="shirts">Пошив футболок / поло</option>
                            <option value="hoodies">Пошив худи и свитшотов</option>
                            <option value="uniform">Корпоративная форма</option>
                            <option value="other">Другой индивидуальный заказ</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn">Отправить заявку</button>
                </form>

                <!-- Сообщение об успешной отправке -->
                <div id="successMessage" class="success-message" style="display: none;">
                    ✅ Спасибо! Ваша заявка принята. Наш менеджер свяжется с вами в ближайшее время.
                </div>
            </section>

        </main>
    </div>

    <!-- Маленький скрипт для обработки нажатия кнопки -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Предотвращаем перезагрузку страницы
            this.style.display = 'none'; // Скрываем форму
            document.getElementById('successMessage').style.display = 'block'; // Показываем сообщение
        });
    </script>
</body>
</html>
